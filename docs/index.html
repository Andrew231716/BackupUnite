<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6fd4">
  <meta name="description" content="Unisci due backup JW Library schema 16 direttamente nel browser.">
  <title>Backup Unite</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app"></main>
  <!--
    No accept filter: on iOS Safari, accept=".jwlibrary" greys out backups because
    the OS does not map that extension to a known document type.
  -->
  <input id="file-input" class="hidden" type="file" multiple>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
