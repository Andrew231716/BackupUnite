name: BackupUnite
options:
  bundleIdPrefix: it.andreapozzi
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    DEVELOPMENT_TEAM: VUJ5NU7V4F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.3.0
targets:
  BackupUnite:
    type: application
    platform: iOS
    info:
      path: BackupUnite/Info.plist
      properties:
        CFBundleDisplayName: Backup Unite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    sources:
      - BackupUnite
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.andreapozzi.backupunite
        PRODUCT_NAME: Backup Unite
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
